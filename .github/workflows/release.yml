name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.8.0)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: get_tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="${REF_NAME#refs/tags/}"
          fi
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid tag format: $tag" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Extract Version Changelog
        id: extract_changelog
        run: |
          TAG="${{ steps.get_tag.outputs.tag }}"
          VERSION="${TAG#v}"
          awk -v ver="$VERSION" '
            function is_version_line(line) {
              return line ~ "^#+ \\[" ver "\\]" || line ~ "^#+ " ver " " || line ~ "^#+ " ver "$"
            }
            function is_other_version(line) {
              return line ~ "^#+ \\[[0-9]+\\.[0-9]+\\.[0-9]+\\]" || line ~ "^#+ [0-9]+\\.[0-9]+\\.[0-9]+"
            }
            /^#+ / {
              if (found && is_other_version($0)) exit
              if (is_version_line($0)) { found = 1; next }
              if (found) print
              next
            }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

          test -s RELEASE_NOTES.md

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.get_tag.outputs.tag }}" \
            --title "Release ${{ steps.get_tag.outputs.tag }}" \
            --notes-file RELEASE_NOTES.md
